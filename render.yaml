services:
  - type: worker
    name: segunda-vuelta-curadoria
    runtime: python
    rootDir: workers/curadoria-imagenes

    buildCommand: pip install -r requirements.txt

    startCommand: python worker.py

    envVars:
      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      - key: SV_IMAGE_BATCH_SIZE
        value: "5"

      - key: SV_IMAGE_POLL_SECONDS
        value: "5"

      - key: SV_IMAGE_ERROR_SLEEP_SECONDS
        value: "15"

      - key: SV_IMAGE_HEARTBEAT_SECONDS
        value: "60"